services:
  - type: web
    name: optichain-backend
    runtime: python
    plan: free
    rootDir: backend
    # Ingest PostgreSQL and train optional quantile artifacts during the build;
    # inference only loads artifacts at startup and never trains on requests.
    buildCommand: pip install -r requirements.txt && python ../scripts/train_quantile_models.py && python -m app.db.ingest --no-backup
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PROJECT_ROOT
        value: /opt/render/project/src
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: ENABLE_HSTS
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_REQUIRE_POSTGRES
        value: "true"
